<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#e5a900"><title>Luciérnaga – Ropa americana en Tarija</title><style id="css">
:root{--bg:#f8fafc;--fg:#111827;--card:#fff;--mut:#6b7280;--bd:#e5e7eb;--pri:#e5a900;--ink:#111827;--ok:#059669;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--fg:#f3f4f6;--card:#1b1e25;--mut:#9ca3af;--bd:#2b2f3a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
button{font:inherit;cursor:pointer;border:0;color:inherit}button:disabled{opacity:.4;cursor:default}
input,textarea,select{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);margin-bottom:8px}
label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--mut);margin:6px 0 3px}label.ck{display:flex;gap:8px;align-items:center;text-transform:none;font-size:14px}label.ck input{width:auto;margin:0}
#adm{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--ink);color:#fff;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 12px;font-size:12px}
#adm button{background:#374151;color:#fff;border-radius:999px;padding:6px 12px;font-weight:700}#adm .go{background:var(--pri);color:#111}
.ban{height:170px;background:linear-gradient(135deg,#111827,#e5a900);overflow:hidden}.ban img{width:100%;height:100%;object-fit:cover;opacity:.85}
.hd{max-width:640px;margin:-28px auto 0;position:relative;background:var(--card);border-radius:24px 24px 0 0;padding:0 16px 14px;text-align:center}
.lg{width:84px;height:84px;border-radius:50%;border:4px solid var(--card);background:var(--ink);color:var(--pri);margin:-42px auto 6px;display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden}.lg img{width:100%;height:100%;object-fit:cover}
h1{margin:0;font-size:24px;font-weight:900}.mut{color:var(--mut);font-size:12px}.st{font-weight:800;font-size:12px;text-transform:uppercase}
.desc{white-space:pre-line;font-size:13px;margin:8px 0}.acts{display:flex;gap:8px;justify-content:center;margin-top:6px}.acts button{background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:7px 14px;font-weight:700;font-size:12px}
#chips{display:flex;gap:8px;overflow-x:auto;max-width:640px;margin:0 auto;padding:10px 16px;background:var(--card)}#chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;font-weight:700;font-size:12px}.chip.on{background:var(--pri);color:#111;border-color:var(--pri)}
.sr{max-width:640px;margin:0 auto;padding:0 16px 8px;background:var(--card)}.sr input{margin:0}
#grid{max-width:640px;margin:14px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden}.card.off{opacity:.7}.im{position:relative;cursor:pointer;aspect-ratio:4/3;background:var(--bd)}.im img{width:100%;height:100%;object-fit:cover;display:block}
.tag,.sold{position:absolute;top:8px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px}.tag{left:8px;background:#fef3c7;color:#78350f}.sold{right:8px;background:#111827;color:#fff}
.cb{padding:12px}.cb h3{margin:0;font-size:14px;font-weight:900;text-transform:uppercase}.cb p{margin:4px 0 0;color:var(--mut);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.row b{font-size:18px}.qty{display:flex;align-items:center;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}.qty button{background:none;width:34px;height:34px;font-weight:800;font-size:16px}.qty span{min-width:20px;text-align:center;font-weight:800}
.ar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;border-top:1px dashed var(--bd);padding-top:8px}.ar button{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:5px 9px;font-size:11px;font-weight:700}.ar .del{color:var(--bad);border-color:var(--bad)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:50px 0}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:20;pointer-events:none}#bar button{pointer-events:auto;display:flex;justify-content:space-between;width:100%;max-width:420px;margin:0 auto;background:var(--pri);color:#111;font-weight:900;padding:14px 20px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#md{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none;align-items:flex-end;justify-content:center}#md.show{display:flex}
.sh{background:var(--card);width:100%;max-width:460px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}@media(min-width:600px){#md{align-items:center}.sh{border-radius:22px}}
.sh h2{margin:0 0 10px;font-size:18px}.pri{width:100%;background:var(--pri);color:#111;font-weight:900;padding:12px;border-radius:12px;margin-top:6px}.sec{width:100%;background:var(--bg);border:1px solid var(--bd);font-weight:700;padding:11px;border-radius:12px;margin-top:6px}.dng{background:var(--bad);color:#fff}
.pv{width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin-bottom:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ci{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.ci img{width:52px;height:52px;border-radius:10px;object-fit:cover}.ci div{flex:1;min-width:0}.ci b{display:block;font-size:12px;text-transform:uppercase}
.ft{text-align:center;margin:30px 0}.ft button{background:none;color:var(--mut);font-size:12px;text-decoration:underline}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#111827;color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;font-size:12px;z-index:90;display:none;max-width:90vw;text-align:center}

$('grid').innerHTML=l.length?l.map((p,i)=>'<article class="card'+(p.on?'':' off')+'"><div class="im" data-a="view" data-id="'+p.id+'"><img src="'+esc(img(p))+'" alt="'+esc(p.name)+'" loading="lazy"><span class="tag">'+esc(p.cat)+'</span>'+(p.on?'':'<span class="sold">AGOTADO</span>')+'</div><div class="cb"><h3>'+esc(p.name)+'</h3><p>'+esc(p.desc)+'</p><div class="row"><b>Bs '+p.price+'</b><div class="qty"><button data-a="dec" data-id="'+p.id+'">−</button><span>'+(cart[p.id]||0)+'</span><button data-a="inc" data-id="'+p.id+'"'+(p.on?'':' disabled')+'>+</button></div></div>'+(adm?'<div class="ar"><button data-a="edit" data-id="'+p.id+'">Editar</button><button data-a="tog" data-id="'+p.id+'">'+(p.on?'Marcar agotado':'Marcar disponible')+'</button><button data-a="up" data-id="'+p.id+'">↑</button><button data-a="dn" data-id="'+p.id+'">↓</button><button class="del" data-a="del" data-id="'+p.id+'">Eliminar</button></div>':'')+'</div></article>').join(''):'<div class="empty">📦<br>No hay prendas en esta categoría.</div>'}
function bar(){$('bar').innerHTML='<button data-a="cart"><span>🛒 Ver carrito ('+count()+')</span><span>Bs '+total()+'</span></button>'}
function render(){head();chips();grid();bar()}
const find=id=>D.products.find(p=>p.id===id);
function setQ(id,d){const p=find(id);if(!p||(d>0&&!p.on))return;const n=Math.max(0,(cart[id]||0)+d);if(n)cart[id]=n;else delete cart[id];grid();bar();if($('cl'))cartView()}
const orderMsg=n=>'¡Hola '+D.store.name+'! 👋\nQuiero pedir:\n\n'+D.products.filter(p=>cart[p.id]).map(p=>cart[p.id]+'x '+p.name+' ('+p.cat+') – Bs '+cart[p.id]*p.price).join('\n')+'\n\nTotal: Bs '+total()+'\nEntrega: '+n,waUrl=n=>'https://wa.me/'+D.store.whatsapp.replace(/\D/g,'')+'?text='+encodeURIComponent(orderMsg(n||'—'));
function cartView(){const nm=($('cn')||{}).value||'',it=D.products.filter(p=>cart[p.id]);$('md').innerHTML='<div class="sh"><h2>🛒 Tu pedido</h2>'+(it.length?it.map(p=>'<div class="ci"><img src="'+esc(img(p))+'" alt=""><div><b>'+esc(p.name)+'</b><span class="mut">'+esc(p.cat)+' · Bs '+p.price+'</span></div><div class="qty"><button data-a="dec" data-id="'+p.id+'">−</button><span>'+cart[p.id]+'</span><button data-a="inc" data-id="'+p.id+'">+</button></div></div>').join('')+'<p id="cl" style="font-size:20px;font-weight:900;text-align:right">Total: Bs '+total()+'</p><label>Tu nombre y referencia de entrega</label><input id="cn" value="'+esc(nm)+'" placeholder="Ej: María Paz – zona Central"><a id="wl" class="pri" target="_blank" rel="noopener" href="'+waUrl(nm)+'" style="display:block;text-align:center;text-decoration:none;background:#059669;color:#fff">Pedir por WhatsApp</a><button class="sec" data-a="copy">Copiar pedido</button>':'<p id="cl" class="empty">Tu carrito está vacío</p>')+'<button class="sec" data-a="close">Seguir viendo</button></div>';$('md').classList.add('show');const c=$('cn'),w=$('wl');if(c&&w){c.oninput=()=>w.href=waUrl(c.value);w.onclick=e=>{if(!c.value.trim()){e.preventDefault();toast('Escribe tu nombre y referencia')}}}}
function send(){const n=($('cn')||{}).value.trim();if(!n){toast('Escribe tu nombre y referencia');return}
const l=D.products.filter(p=>cart[p.id]).map(p=>cart[p.id]+'x '+p.name+' ('+p.cat+') – Bs '+cart[p.id]*p.price);
const m='¡Hola '+D.store.name+'! 👋\nQuiero pedir:\n\n'+l.join('\n')+'\n\nTotal: Bs '+total()+'\nEntrega: '+n;window.open('https://wa.me/'+D.store.whatsapp.replace(/\D/g,'')+'?text='+encodeURIComponent(m),'_blank')}
const shrink=async(f,m=900,sq)=>{let i;try{i=await createImageBitmap(f)}catch(e){i=await new Promise((ok,no)=>{const im=new Image;im.onload=()=>ok(im);im.onerror=no;im.src=URL.createObjectURL(f)})}
const w=i.width,h=i.height,s=Math.min(w,h),sw=sq?s:w,sh=sq?s:h,k=Math.min(1,m/sw),c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);
c.getContext('2d').drawImage(i,sq?(w-s)/2:0,sq?(h-s)/2:0,sw,sh,0,0,c.width,c.height);return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(),'image/jpeg',.8))};
function pick(id,cb,m,sq){$(id).onchange=async e=>{const f=e.target.files[0];if(!f)return;toast('Cargando foto…');try{const b=await shrink(f,m,sq);let u;try{const as=await claude.use('assets');if(as)u=(await as.upload(b)).url}catch(x){}
if(!u)u=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});cb(u);toast('Foto cargada')}catch(x){toast('No se pudo leer la foto. Prueba con otra imagen (JPG o PNG)')}e.target.value=''}}
function pform(id){ed=id?find(id):null;const p=ed||{name:'',cat:'',price:'',desc:'',image:'',on:true};tmp=p.image;
modal('<h2>'+(ed?'Editar':'Nueva')+' prenda</h2><img id="pv" class="pv" src="'+esc(img(p))+'" alt=""><input type="file" id="fi" accept="image/*"><label>Nombre</label><input id="fn" value="'+esc(p.name)+'" placeholder="POLERA NEGRA"><div class="g2"><div><label>Categoría / talla</label><input id="fc" list="cl2" value="'+esc(p.cat)+'" placeholder="TALLA L"><datalist id="cl2">'+[...new Set(D.products.map(x=>x.cat))].map(c=>'<option value="'+esc(c)+'">').join('')+'</datalist></div><div><label>Precio (Bs)</label><input id="fp" type="number" min="0" value="'+esc(p.price)+'"></div></div><label>Descripción</label><textarea id="fd" rows="3">'+esc(p.desc)+'</textarea><label class="ck"><input id="fo" type="checkbox"'+(p.on?' checked':'')+'> Disponible</label><button class="pri" data-a="psave">Guardar prenda</button><button class="sec" data-a="close">Cancelar</button>');pick('fi',u=>{tmp=u;$('pv').src=u})}
function psave(){const name=$('fn').value.trim().toUpperCase(),price=Number($('fp').value);if(!name||!(price>0)){toast('Pon nombre y un precio válido');return}
const o={name,cat:$('fc').value.trim().toUpperCase()||'GENERAL',price,desc:$('fd').value.trim(),image:tmp||'',on:$('fo').checked};
if(ed)Object.assign(ed,o);else D.products.unshift({id:'p'+Date.now(),...o});closeM();touch();toast('Guardado. Pulsa "Publicar cambios" para que lo vean tus clientes')}
function cfg(){const s=D.store;tmp={b:s.banner,l:s.logo};
modal('<h2>Ajustes de la tienda</h2><label>Nombre</label><input id="sn" value="'+esc(s.name)+'"><label>Ubicación</label><input id="sl" value="'+esc(s.location)+'"><label>WhatsApp (con código de país)</label><input id="sw" inputmode="numeric" value="'+esc(s.whatsapp)+'" placeholder="59170000000"><label>Descripción</label><textarea id="sd" rows="4">'+esc(s.desc)+'</textarea><div class="g2"><div><label>Abre</label><input id="so" type="time" value="'+s.open+'"></div><div><label>Cierra</label><input id="sc" type="time" value="'+s.close+'"></div></div><label>Estado</label><select id="sf"><option value="auto">Automático por horario</option><option value="open">Siempre abierto</option><option value="closed">Siempre cerrado</option></select><label>Portada (fondo)</label><img id="pb" class="pv" src="'+esc(s.banner)+'" alt=""'+(s.banner?'':' hidden')+'><label class="sec" style="display:block;text-align:center;text-transform:none;cursor:pointer;font-size:14px;color:var(--fg)">📷 Elegir portada de la galería<input type="file" id="sb" accept="image/*" hidden></label><label>Logo / ícono</label><img id="pl" class="pv" style="width:90px;height:90px;border-radius:50%" src="'+esc(s.logo)+'" alt=""'+(s.logo?'':' hidden')+'><label class="sec" style="display:block;text-align:center;text-transform:none;cursor:pointer;font-size:14px;color:var(--fg)">📷 Elegir logo de la galería<input type="file" id="sg" accept="image/*" hidden></label><button class="pri" data-a="ssave">Guardar tienda</button><hr><h2>Publicar en GitHub</h2><button class="sec" data-a="gh">Conectar GitHub</button><hr><h2>Cambiar contraseña</h2><label>Contraseña actual</label><input id="p0" type="password"><label>Nueva contraseña (mínimo 6)</label><input id="p1" type="password"><button class="sec" data-a="pwd">Cambiar contraseña</button><button class="sec" data-a="close">Cerrar</button>');
$('sf').value=s.force?s.forced:'auto';pick('sb',u=>{D.store.banner=u;$('pb').src=u;$('pb').hidden=false;touch();toast('Portada lista. Pulsa Publicar cambios')},1200);pick('sg',u=>{D.store.logo=u;$('pl').src=u;$('pl').hidden=false;touch();toast('Logo listo. Pulsa Publicar cambios')},400,true)}
function ssave(){const s=D.store,f=$('sf').value;Object.assign(s,{name:$('sn').value.trim()||'Luciérnaga',location:$('sl').value.trim(),whatsapp:$('sw').value.replace(/\D/g,'')||s.whatsapp,desc:$('sd').value,open:$('so').value||'08:00',close:$('sc').value||'20:00',force:f!=='auto',forced:f==='open'?'open':'closed'});closeM();touch();toast('Tienda actualizada. Publica los cambios')}
async function pwd(){if(await sha(D.sec.salt+$('p0').value)!==D.sec.hash){toast('La contraseña actual no coincide');return}const n=$('p1').value;if(n.length<6){toast('La nueva debe tener al menos 6 caracteres');return}
const salt='s'+Math.random().toString(36).slice(2)+'-';D.sec={salt,hash:await sha(salt+n)};closeM();touch();toast('Contraseña lista. Pulsa "Publicar cambios" para guardarla')}
async function login(){if(await sha(D.sec.salt+$('pw').value)===D.sec.hash){adm=true;try{S.setItem('lc_a','1')}catch(e){}closeM();render();toast('Modo dueño activado')}else $('pe').hidden=false}
const GH=()=>{try{return JSON.parse(localStorage.getItem('lc_gh')||'null')}catch(e){return null}};
function ghForm(){const g=GH()||{};modal('<h2>Conectar con GitHub</h2><p class="mut">Estos datos se guardan solo en este celular o computadora.</p><label>Usuario de GitHub</label><input id="gu" value="'+esc(g.u||'')+'"><label>Nombre del repositorio</label><input id="gr" value="'+esc(g.r||'')+'"><label>Token de acceso</label><input id="gt" type="password" value="'+esc(g.t||'')+'"><button class="pri" data-a="ghsave">Guardar conexión</button><button class="sec" data-a="close">Cancelar</button>')}
function ghsave(){const g={u:$('gu').value.trim(),r:$('gr').value.trim(),t:$('gt').value.trim()};if(!g.u||!g.r||!g.t){toast('Completa los tres datos');return}try{localStorage.setItem('lc_gh',JSON.stringify(g))}catch(e){toast('Este navegador no permite guardar la conexión');return}closeM();toast('Conexión guardada');if(dirty)pub()}
async function pub(){if(!dirty)return;const g=GH();if(!g||!g.u||!g.r||!g.t){ghForm();return}toast('Publicando…');
try{const api='https://api.github.com/repos/'+g.u+'/'+g.r+'/contents/index.html',h={Authorization:'Bearer '+g.t,Accept:'application/vnd.github+json'};
const r0=await fetch(api,{headers:h});let sha;if(r0.ok)sha=(await r0.json()).sha;else if(r0.status!==404)throw new Error(r0.status);
const by=new TextEncoder().encode(build(D));let bin='';for(let i=0;i<by.length;i+=8192)bin+=String.fromCharCode.apply(null,by.subarray(i,i+8192));
const r1=await fetch(api,{method:'PUT',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({message:'Actualizar catálogo',content:btoa(bin),sha})});
if(!r1.ok)throw new Error(r1.status);S.removeItem('lc_d');dirty=false;render();toast('¡Publicado! Tus clientes lo verán en 1 o 2 minutos')}
catch(e){const m={401:'El token no es válido o venció',403:'El token no tiene permiso de escritura',404:'No encuentro el repositorio. Revisa usuario y nombre',409:'Hubo un conflicto. Intenta de nuevo',422:'GitHub rechazó el archivo. Intenta de nuevo'};toast(m[e.message]||'No se pudo publicar. Revisa tu internet e intenta de nuevo')}}
function mv(id,d){const i=D.products.findIndex(p=>p.id===id),j=i+d;if(j<0||j>=D.products.length)return;[D.products[i],D.products[j]]=[D.products[j],D.products[i]];touch()}
const A={gh:ghForm,ghsave,close:closeM,copy:async()=>{const n=($('cn')||{}).value||'';if(!n.trim()){toast('Escribe tu nombre y referencia');return}try{await navigator.clipboard.writeText(orderMsg(n));toast('Pedido copiado. Pégalo en WhatsApp al +'+D.store.whatsapp)}catch(e){toast('No se pudo copiar')}},cat:(id,b)=>{cat=id;chips();grid()},inc:id=>setQ(id,1),dec:id=>setQ(id,-1),cart:cartView,send,
view:id=>{const p=find(id);if(p)modal('<img class="pv" src="'+esc(img(p))+'" alt=""><span class="tag" style="position:static;display:inline-block">'+esc(p.cat)+'</span><h2 style="margin-top:8px">'+esc(p.name)+'</h2><div style="font-size:24px;font-weight:900">Bs '+p.price+'</div><p class="desc">'+esc(p.desc)+'</p><button class="pri" data-a="inc" data-id="'+p.id+'" data-close="1"'+(p.on?'':' disabled')+'>Agregar al carrito</button><button class="sec" data-a="close">Cerrar</button>')},
share:async()=>{const u=D.store.link||location.href.split('#')[0];try{await navigator.share({url:u})}catch(e){if(e&&e.name==='AbortError')return;try{await navigator.clipboard.writeText(u);toast('Enlace copiado')}catch(x){modal('<h2>Copia el enlace</h2><input value="'+esc(u)+'" onclick="this.select()"><button class="sec" data-a="close">Cerrar</button>')}}},
wa:()=>window.open('https://wa.me/'+D.store.whatsapp.replace(/\D/g,'')+'?text='+encodeURIComponent('¡Hola '+D.store.name+'! Vi su catálogo 😊'),'_blank'),
cmt:()=>modal('<h2>💬 Déjanos tu comentario</h2><label>Tu nombre</label><input id="cmn"><label>Comentario</label><textarea id="cmx" rows="4" placeholder="Cuéntanos qué te pareció…"></textarea><button class="pri" data-a="cmsend" style="background:#059669;color:#fff">Enviar por WhatsApp</button><button class="sec" data-a="close">Cancelar</button>'),cmsend:()=>{const t=$('cmx').value.trim();if(!t){toast('Escribe tu comentario');return}window.open('https://wa.me/'+D.store.whatsapp.replace(/\D/g,'')+'?text='+encodeURIComponent('💬 Comentario para '+D.store.name+'\nDe: '+($('cmn').value.trim()||'Cliente')+'\n\n'+t),'_blank');closeM()},logo:()=>{const f=A.logo;f.n=(f.n||0)+1;clearTimeout(f.t);f.t=setTimeout(()=>f.n=0,2500);if(f.n>=5){f.n=0;if(!adm)A.login()}},
login:()=>modal('<h2>Acceso del dueño</h2><input id="pw" type="password" placeholder="Contraseña"><p id="pe" hidden style="color:var(--bad);font-weight:700">Contraseña incorrecta</p><button class="pri" data-a="dologin">Entrar</button><button class="sec" data-a="close">Cancelar</button>'),dologin:login,
logout:()=>{adm=false;try{S.removeItem('lc_a')}catch(e){}render()},add:()=>pform(),edit:pform,psave,cfg,ssave,pwd,pub,
tog:id=>{const p=find(id);p.on=!p.on;touch()},up:id=>mv(id,-1),dn:id=>mv(id,1),del:id=>ask('¿Eliminar esta prenda?',()=>{D.products=D.products.filter(p=>p.id!==id);delete cart[id];touch();toast('Prenda eliminada')})};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||!A[b.dataset.a])return;A[b.dataset.a](b.dataset.id,b);if(b.dataset.close){closeM();toast('Agregado al carrito')}});
shell();render();setInterval(head,30000);window.addEventListener('hashchange',head);if(!adm&&location.hash==='#dueno')A.login();
</script></body></html>
